name: Security Audit

on:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build temporary lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
