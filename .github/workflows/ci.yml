name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://seotable:seotable@localhost:5432/seotable
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Use repository npm version
        run: npm install --global npm@11.19.1
      - name: Install
        run: npm install
      - name: Lint workspaces
        run: npm run lint
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Build crawler contracts
        run: npm run build --workspace=@seo-table/crawler
      - name: Build execution policy
        run: npm run build --workspace=@seo-table/execution
