<title>SEO Table Console</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Sora:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   SEO Table — dark-committed design system
   Single visual world (dark premium). Every color painted
   explicitly from tokens; no theme inversion.
   ============================================================ */
:root{
  /* ground — near-black with a green bias, not neutral grey */
  --bg:#080B09;
  --bg-2:#0D120F;
  --surface:#121815;
  --surface-2:#18201C;
  --surface-3:#1E2823;
  --border:#243029;
  --border-strong:#314138;

  /* ink */
  --ink:#E8F1EC;
  --ink-2:#A3B3AA;
  --ink-3:#6D7E75;

  /* accent — emerald neon, spent sparingly */
  --acc:#2BE08A;
  --acc-hi:#63F2AD;
  --acc-dim:#0E9A5C;
  --acc-08:rgba(43,224,138,.08);
  --acc-14:rgba(43,224,138,.14);
  --acc-24:rgba(43,224,138,.24);
  --acc-ink:#062B18;

  /* status — reserved, never used as a series hue */
  --ok:#35D399;
  --warn:#F3C24B;
  --serious:#F79245;
  --crit:#F0655E;
  --info:#5BB8F5;
  --ok-08:rgba(53,211,153,.10);
  --warn-08:rgba(243,194,75,.10);
  --serious-08:rgba(247,146,69,.10);
  --crit-08:rgba(240,101,94,.10);
  --info-08:rgba(91,184,245,.10);

  --r-sm:6px; --r:10px; --r-lg:14px;
  --sp:16px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 28px -18px rgba(0,0,0,.9);

  --f-fa:"Vazirmatn", system-ui, sans-serif;
  --f-en:"Sora", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-fa); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
[dir="ltr"] body, body[data-lang="en"]{font-family:var(--f-en)}
body[data-lang="en"]{font-size:13.5px}
.num,td.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
::selection{background:var(--acc-24)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:248px 1fr;min-height:100%}
aside{
  background:var(--bg-2);border-inline-end:1px solid var(--border);
  display:flex;flex-direction:column;gap:4px;padding:18px 12px;
  position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{
  width:30px;height:30px;border-radius:8px;flex:none;
  background:linear-gradient(145deg,var(--acc),#0E9A5C);
  display:grid;place-items:center;color:var(--acc-ink);font-weight:700;
  font-family:var(--f-en);font-size:13px;box-shadow:0 0 0 1px rgba(43,224,138,.3), 0 6px 18px -10px var(--acc);
}
.brand b{font-family:var(--f-en);font-weight:600;font-size:15px;letter-spacing:-.02em}
.brand span{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-family:var(--f-en)}
.navgroup{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:16px 10px 6px}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;border-radius:var(--r);color:var(--ink-2);
  transition:background .14s,color .14s;text-align:start;
}
.navbtn svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:var(--surface);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--acc-08);color:var(--acc-hi);box-shadow:inset 0 0 0 1px var(--acc-24)}
.navbtn .tag{margin-inline-start:auto;font-size:11px;background:var(--surface-3);color:var(--ink-2);border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums}
.navbtn[aria-current="page"] .tag{background:var(--acc-24);color:var(--acc-hi)}

main{min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 24px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(8px);
}
.crumb{color:var(--ink-3);font-size:12.5px}
.crumb b{color:var(--ink);font-weight:500}
.spacer{margin-inline-start:auto}
.view{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1320px;width:100%}

/* ---------- controls ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-sm);
  background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-strong);
  color:var(--ink);font-size:13px;transition:background .14s,box-shadow .14s;
}
.btn:hover{background:var(--surface-3)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--acc);color:var(--acc-ink);box-shadow:0 6px 18px -12px var(--acc);font-weight:600}
.btn.primary:hover{background:var(--acc-hi)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--border)}
.btn.ghost:hover{background:var(--surface)}
.btn.danger{background:transparent;color:var(--crit);box-shadow:inset 0 0 0 1px rgba(240,101,94,.4)}
.btn.danger:hover{background:var(--crit-08)}
.btn.sm{padding:4px 9px;font-size:12px}
.seg{display:inline-flex;background:var(--surface);border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--border);padding:2px}
.seg button{padding:4px 11px;border-radius:4px;font-size:12.5px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
.langsw button{font-family:var(--f-en);font-size:11.5px;letter-spacing:.04em}
input,select{
  font:inherit;font-size:13px;color:var(--ink);background:var(--bg-2);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;width:100%;
}
input::placeholder{color:var(--ink-3)}
input:focus,select:focus{border-color:var(--border-strong);outline:none;box-shadow:0 0 0 3px var(--acc-08)}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2)}
.search{position:relative;max-width:300px;flex:1 1 180px}
.search input{padding-inline-start:32px}
.search svg{position:absolute;inset-inline-start:10px;top:9px;width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:1.7}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border)}
.card>header h3{font-size:14px}
.card>header .sub{font-size:12px;color:var(--ink-3)}
.card .body{padding:18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}

/* tiles: the only place big numerals are spent */
.tile{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.tile .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:var(--f-en);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile .foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.delta{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;font-family:var(--f-en);font-size:12px}
.delta.up{color:var(--ok)} .delta.down{color:var(--crit)}

/* pills & chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{color:var(--ok);background:var(--ok-08);box-shadow:inset 0 0 0 1px rgba(53,211,153,.24)}
.pill.warn{color:var(--warn);background:var(--warn-08);box-shadow:inset 0 0 0 1px rgba(243,194,75,.24)}
.pill.serious{color:var(--serious);background:var(--serious-08);box-shadow:inset 0 0 0 1px rgba(247,146,69,.24)}
.pill.crit{color:var(--crit);background:var(--crit-08);box-shadow:inset 0 0 0 1px rgba(240,101,94,.26)}
.pill.info{color:var(--info);background:var(--info-08);box-shadow:inset 0 0 0 1px rgba(91,184,245,.24)}
.pill.mute{color:var(--ink-2);background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--border)}
.pill.acc{color:var(--acc-hi);background:var(--acc-08);box-shadow:inset 0 0 0 1px var(--acc-24)}
.pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* severity stripe encodes state in form, not only color */
.sev{display:inline-flex;align-items:center;gap:7px;font-size:12.5px}
.sev i{width:3px;height:14px;border-radius:2px;background:currentColor;display:block;flex:none}
.sev.crit{color:var(--crit)} .sev.serious{color:var(--serious)}
.sev.warn{color:var(--warn)} .sev.ok{color:var(--ok)} .sev.info{color:var(--info)}
.sev span{color:var(--ink)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:start;font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;
}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td .path{color:var(--ink-2);font-family:var(--f-mono);font-size:12px}
.tnum{text-align:end;font-variant-numeric:tabular-nums;font-family:var(--f-en)}

/* misc blocks */
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.bar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--acc)}
.note{
  display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);font-size:12.5px;line-height:1.7;
  background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);color:var(--ink-2);
}
.note svg{width:16px;height:16px;flex:none;margin-top:2px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.note.lock{color:var(--warn);background:var(--warn-08);box-shadow:inset 0 0 0 1px rgba(243,194,75,.24)}
.note.acc{color:var(--acc-hi);background:var(--acc-08);box-shadow:inset 0 0 0 1px var(--acc-24)}
.diff{font-family:var(--f-mono);font-size:12px;border-radius:var(--r);overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.diff div{padding:7px 12px;display:flex;gap:10px;align-items:flex-start}
.diff .del{background:var(--crit-08);color:#F6A29D}
.diff .add{background:var(--ok-08);color:#7FE3BC}
.diff em{font-style:normal;opacity:.6;flex:none;width:12px;text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:46px 20px;text-align:center;color:var(--ink-3)}
.empty svg{width:28px;height:28px;stroke:var(--border-strong);fill:none;stroke-width:1.5}
.feed{display:flex;flex-direction:column}
.feed li{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);font-size:12.5px;list-style:none}
.feed li:last-child{border-bottom:0}
.feed .ic{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2)}
.feed .ic svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.feed time{color:var(--ink-3);font-size:11.5px;margin-inline-start:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding-inline-start:18px;color:var(--ink-2);font-size:12.5px;line-height:1.9}

/* stepper */
.steps{display:flex;gap:0;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px;padding:0 18px 0 0;flex:1 1 170px;min-width:0}
.step .n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-family:var(--f-en);
  background:var(--surface-3);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--border)}
.step.done .n{background:var(--acc-14);color:var(--acc-hi);box-shadow:inset 0 0 0 1px var(--acc-24)}
.step.now .n{background:var(--acc);color:var(--acc-ink);box-shadow:0 6px 18px -12px var(--acc)}
.step .t{font-size:12.5px;color:var(--ink-3);min-width:0}
.step.now .t,.step.done .t{color:var(--ink)}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:10.5px;font-family:var(--f-en)}
.chart .grid-l{stroke:var(--border);stroke-width:1}
.tip{
  position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--border-strong),0 14px 30px -18px #000;
  border-radius:var(--r-sm);padding:7px 10px;font-size:12px;white-space:nowrap;
}
.tip b{font-family:var(--f-en);font-variant-numeric:tabular-nums}
.gauge-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.gauge-v{font-family:var(--f-en);font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}

/* responsive */
@media (max-width:980px){
  #shell{grid-template-columns:1fr}
  aside{
    position:static;height:auto;flex-direction:row;align-items:center;gap:6px;
    overflow-x:auto;padding:10px 12px;border-inline-end:0;border-bottom:1px solid var(--border);
  }
  .brand{padding:0 12px 0 0;flex:none}
  .brand span{display:none}
  .navgroup{display:none}
  .navbtn{width:auto;white-space:nowrap;flex:none}
  .view{padding:18px 16px}
  .topbar{padding:12px 16px}
  .split,.g4,.g3,.g2{grid-template-columns:1fr}
}
@media (min-width:981px) and (max-width:1240px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:1fr}
}
</style>

<div id="shell">
  <aside id="nav"></aside>
  <main>
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <div class="seg langsw" role="group" aria-label="Language">
        <button id="fa" aria-pressed="true">فارسی</button>
        <button id="en" aria-pressed="false">EN</button>
      </div>
      <button class="btn primary" id="scanBtn"></button>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

function lineChart(data,id){
  var W=680,H=210,pl=34,pr=14,pt=14,pb=24;
  var min=Math.min.apply(null,data)-4, max=Math.max.apply(null,data)+4;
  var x=function(i){return pl+i*(W-pl-pr)/(data.length-1)};
  var y=function(v){return pt+(max-v)/(max-min)*(H-pt-pb)};
  var pts=data.map(function(v,i){return x(i)+","+y(v)});
  var gl="",ticks=[60,65,70,75];
  ticks.forEach(function(v){
    gl+='<line class="grid-l" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/>'+
        '<text x="'+(pl-8)+'" y="'+(y(v)+3.5).toFixed(1)+'" text-anchor="end">'+n(v)+'</text>';
  });
  var last=data.length-1;
  var xl=[[0,{fa:"۳۰ روز پیش",en:"30d ago"}],[Math.floor(last/2),{fa:"۱۵ روز",en:"15d"}],[last,{fa:"امروز",en:"today"}]];
  var xt="";
  xl.forEach(function(p,k){
    xt+='<text x="'+x(p[0])+'" y="'+(H-6)+'" text-anchor="'+(k===0?"start":k===2?"end":"middle")+'">'+esc(bi(p[1]))+'</text>';
  });
  return '<svg class="chart" id="'+id+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(t("score_trend"))+'">'+
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#2BE08A" stop-opacity=".28"/><stop offset="1" stop-color="#2BE08A" stop-opacity="0"/>'+
    '</linearGradient></defs>'+gl+xt+

    '<polyline fill="none" stroke="#2BE08A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.join(" ")+'"/>'+
    '<line id="cross" x1="0" x2="0" y1="'+pt+'" y2="'+(H-pb)+'" stroke="#314138" stroke-width="1" opacity="0"/>'+
    '<circle id="dot" r="4" fill="#2BE08A" stroke="#080B09" stroke-width="2" opacity="0"/>'+

function wireLine(data){
  var s=document.getElementById("lineC"); if(!s)return;
  var hit=s.querySelector("#hit"),cr=s.querySelector("#cross"),dt=s.querySelector("#dot"),tip=document.getElementById("tip");
  var W=680,pl=34,pr=14,pt=14,pb=24,H=210;
  var min=Math.min.apply(null,data)-4,max=Math.max.apply(null,data)+4;
  function move(e){
    var r=s.getBoundingClientRect(), rel=(e.clientX-r.left)/r.width*W;
    var i=Math.round((rel-pl)/((W-pl-pr)/(data.length-1)));
    i=Math.max(0,Math.min(data.length-1,i));
    var px=pl+i*(W-pl-pr)/(data.length-1), py=pt+(max-data[i])/(max-min)*(H-pt-pb);
    cr.setAttribute("x1",px);cr.setAttribute("x2",px);cr.setAttribute("opacity","1");
    dt.setAttribute("cx",px);dt.setAttribute("cy",py);dt.setAttribute("opacity","1");
    var d=data.length-1-i;
    tip.innerHTML='<b>'+n(data[i])+'</b> · '+(d===0?esc(bi({fa:"امروز",en:"today"})):esc(n(d)+" "+bi({fa:"روز پیش",en:"d ago"})));
    tip.style.opacity="1";
    tip.style.left=Math.min(window.innerWidth-150,r.left+px/W*r.width+12)+"px";
    tip.style.top=(r.top+py/H*r.height-10)+"px";
  }
  function out(){cr.setAttribute("opacity","0");dt.setAttribute("opacity","0");document.getElementById("tip").style.opacity="0"}
  hit.addEventListener("mousemove",move); hit.addEventListener("mouseleave",out);
  s.addEventListener("touchmove",function(e){if(e.touches[0])move(e.touches[0])},{passive:true});
}
function sevBars(){
  var max=Math.max.apply(null,SEVER.map(function(s){return s.v}));

    h+='<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">'+

  });
  return h+'</div>';
}

   '<text x="70" y="62" text-anchor="middle" style="fill:var(--ink);font-size:26px;font-weight:600">'+n(v)+'</text>'+

function pillFor(st){

         applied:["ok","check"],blocked:["warn","lock"],open:["serious","alert"],fixed:["ok","check"],ignored:["mute","eye"],
         connected:["ok","check"],not:["mute","x"],ready:["info","info"]};
  var k=m[st]||["mute","info"], lab={running:"running",queued:"queued",done:"done",failed:"failed",applied:"applied",
   blocked:"blocked",open:"open",fixed:"fixed",ignored:"ignored",connected:"connected",not:"not_connected",ready:"ready"}[st]||st;
  return '<span class="pill '+k[0]+'">'+svg(k[1])+t(lab)+'</span>';

function riskPill(r){

/* ============================ render ============================ */
function render(){
  var d=D[S.lang].dir;
  document.documentElement.setAttribute("dir",d);
  document.documentElement.setAttribute("lang",S.lang);
  document.body.setAttribute("data-lang",S.lang);
  document.getElementById("fa").setAttribute("aria-pressed",S.lang==="fa");
  document.getElementById("en").setAttribute("aria-pressed",S.lang==="en");
  document.getElementById("scanBtn").innerHTML=svg("play")+t("scan");
  document.getElementById("crumb").innerHTML="SEO Table <span style='opacity:.4'>/</span> <b>"+t(S.screen)+"</b>";
  renderNav();
  document.getElementById("view").innerHTML=(V[S.screen]||V.dashboard)();
  if(S.screen==="dashboard")wireLine(TREND);
  window.scrollTo({top:0});
}
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");
  if(g){S.screen=g.getAttribute("data-go");if(S.screen==="audit")S.tab="tab_over";render();return}
  var tb=e.target.closest("[data-tab]"); if(tb){S.tab=tb.getAttribute("data-tab");render();return}
  var sb=e.target.closest("[data-stab]"); if(sb){S.sTab=sb.getAttribute("data-stab");render();return}
  if(e.target.closest("#fa")){S.lang="fa";render();return}
  if(e.target.closest("#en")){S.lang="en";render();return}
  if(e.target.closest("#scanBtn")){S.screen="audit";S.tab="tab_log";render();return}
});
render();
})();
</script>
